  <!-- Ears -->
  <rect x="48" y="72" width="14" height="22" rx="5" fill="white"/>
  <rect x="138" y="72" width="14" height="22" rx="5" fill="white"/>
  <!-- Visor -->
  <rect x="72" y="70" width="56" height="22" rx="11" fill="#E91E6B"/>
  <!-- Eyes -->
